spring.application.name=demo

# --- Datasource -------------------------------------------------------------
# The password falls back to the local dev value; override with POSTGRES_PASSWORD
# (or SPRING_DATASOURCE_PASSWORD) in any real environment.
spring.datasource.url=jdbc:postgresql://localhost:5432/payroll
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:mypass}

# --- JPA --------------------------------------------------------------------
# Flyway owns the schema; Hibernate only checks that the entities still match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway -----------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- External HRMS API ------------------------------------------------------
# Point base-url at the Workday/HRMS REST endpoint. The token must come from the
# environment; never commit a real one.
payroll.hrms.base-url=${HRMS_BASE_URL:http://localhost:8081/hrms/v1}
payroll.hrms.api-token=${HRMS_API_TOKEN:}
payroll.hrms.tenant=${HRMS_TENANT:}

# Both timeouts are explicit. The JDK HTTP client waits forever on a read by
# default, which turns a stalled HRMS into a stuck ingestion thread.
payroll.hrms.connect-timeout=3s
payroll.hrms.read-timeout=10s

payroll.hrms.page-size=100
payroll.hrms.max-pages=500

# Retries apply to 429/5xx/timeouts only; 4xx fails on the first attempt.
payroll.hrms.retry.max-attempts=4
payroll.hrms.retry.initial-backoff=500ms
payroll.hrms.retry.max-backoff=8s
payroll.hrms.retry.multiplier=2.0
payroll.hrms.retry.jitter=0.25
payroll.hrms.retry.max-retry-after=60s

# --- Scheduled ingestion ----------------------------------------------------
# Opt-in, so running the app locally never starts pulling from a real HRMS.
payroll.ingestion.scheduled.enabled=${INGESTION_SCHEDULE_ENABLED:false}
payroll.ingestion.scheduled.cron=0 15 2 * * *
payroll.ingestion.scheduled.zone=UTC
